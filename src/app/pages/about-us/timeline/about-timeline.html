<div class="border-b border-maison-stone dark:border-dark-border">
  <div class="px-5 py-10 md:px-12 md:py-14 border-b border-maison-stone dark:border-dark-border">
    <p class="font-mono text-2xs tracking-ultra uppercase text-accent mb-4">Milestones</p>
    <h2
      class="font-display font-medium leading-none tracking-tightest text-maison-black dark:text-dark-heading text-4xl md:text-5xl"
    >
      The road<br /><em class="italic text-accent font-[serif]">so far</em>
    </h2>
  </div>

  <div class="flex flex-col md:grid md:grid-cols-[200px_1fr]">
    @for (milestone of milestones(); track milestone.year; let last = $last) {
      <div
        class="flex md:flex-col items-center md:items-start gap-4 md:gap-0 px-5 pt-8 md:px-12 md:pt-10 md:pb-0 md:border-r border-maison-stone dark:border-dark-border"
      >
        <p
          class="font-display font-light text-4xl md:text-5xl leading-none text-maison-ash dark:text-dark-muted transition-colors duration-250 flex-shrink-0"
        >
          {{ milestone.year }}
        </p>
        <div class="hidden md:flex items-center gap-0 mt-4">
          <div
            class="w-3 h-3 rounded-full border-2 border-accent bg-maison-white dark:bg-dark-base flex-shrink-0 -mr-1.5 z-raised relative"
          ></div>
          @if (!last) {
            <div
              class="w-px flex-1 bg-maison-charcoal dark:bg-dark-border"
              style="height: 100%; min-height: 4rem"
            ></div>
          }
        </div>
      </div>

      <div
        class="group px-5 py-8 md:px-12 md:py-10 border-b border-maison-stone dark:border-dark-border hover:bg-maison-cream dark:hover:bg-dark-surface transition-colors duration-250 ease-luxe cursor-default"
        [class.border-b-0]="last"
      >
        <h3
          class="font-display font-light text-xl md:text-2xl tracking-tight text-maison-ink dark:text-dark-heading mb-3 leading-tight"
        >
          {{ milestone.title }}
        </h3>
        <p
          class="font-sans text-sm leading-relaxed text-maison-ash dark:text-dark-muted max-w-[52ch]"
        >
          {{ milestone.body }}
        </p>
        <div
          class="mt-5 h-px w-8 bg-maison-stone dark:bg-dark-border transition-all duration-500 ease-luxe group-hover:w-16 group-hover:bg-accent"
        ></div>
      </div>
    }
  </div>
</div>
